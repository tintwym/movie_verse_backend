name: Static Code Analysis (SAST)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  sast:
    name: Static Application Security Testing (SAST)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python (Semgrep, before Maven)
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install and run Semgrep on source only
      run: |
        python -m pip install --upgrade pip
        pip install "semgrep>=1.45.0"
        mkdir -p reports
        # Run before Maven so `target/` is not scanned; use p/java (stable) instead of `auto` (registry-heavy)
        semgrep scan --config p/java --json src > reports/semgrep-report.json

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'maven'

    - name: Verify Java Installation
      run: java -version && echo "$JAVA_HOME"

    - name: Build with Maven (Skip Tests)
      run: |
        chmod +x mvnw
        ./mvnw --no-transfer-progress clean install -DskipTests

    - name: Run Security Check on Dependencies (OWASP Dependency Check)
      run: |
        java -version
        mkdir -p reports
        chmod -R 777 reports
        docker run --rm \
          --volume "$(pwd):/src" \
          owasp/dependency-check \
          --scan /src \
          --format HTML \
          --out /src/reports \
          --failOnCVSS 0 || echo "Dependency Check completed with warnings"

    - name: Upload Security Reports (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: reports
